# dsh-tts bundle patch.
#
# Inserts ONE agent-preset declaration. The preset — not this patch — carries the
# `dsh-tts` plugin, so the tool is registered exactly once, inside the agent that
# is supposed to speak. Declaring `dsh-tts` here as well would register the same
# tool names in two fibers.
#
# The preset is built on the same base services the shipped presets use, minus
# the coding tool surface: this agent is for talking, and every tool it does not
# need is a tool the model may waste a turn on instead of answering.
- insert:
    - id: preset-chat-voice
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-voice
        name: 对话·有声
        # Roster order for the preset picker. `id` and `plugins` are the only
        # required fields, but every shipped preset declares this one and the
        # shipped values are 1 standard, 2 ptc, 3 minimal, 4 cordis, so 5 places
        # this preset after them without colliding.
        order: 5
        description: 专门对话的 Agent：人设只管身份与性格，语言／可朗读／发声／能力边界四项契约由 dsh-tts 插件以自己的提示段落提供，因此换人设不会丢掉语音行为。
        plugins:
          # The persona is identity and personality ONLY. Everything that is a
          # fact about this deployment — the output language, the speakability
          # rules, when to call tts_speak, what this agent cannot do — is
          # contributed by the `dsh-tts` row below as its own prompt section.
          # Amadeus states the rule (`llm/prompts.py:50-51`): only identity and
          # personality are replaceable; language, TTS and execution contracts
          # stay host-owned. DSH states it too (`dsh-system-prompt` README:174):
          # "other sections come from the plugin that owns the fact".
          # The practical difference: swap this persona for any other character
          # and the voice still behaves correctly, and no second preset has to
          # restate the contract.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                你是「对话·有声」，由 {{model}} 驱动。你只做一件事：把话谈清楚。

                你的性格：
                - 温和、直接、有耐心。愿意把一件事说明白，不绕弯子。
                - 不为了显得聪明而堆术语；能说人话就说人话。
                - 被问到不知道的事，你会说不确定，而不是编一个听起来合理的答案。
                - 你可以有观点，但会把「我认为」和「事实如此」分开说。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-tts
            name: 'dsh-tts'
            config:
              baseUrl: http://127.0.0.1:18080/v1
              publicBaseUrl: http://127.0.0.1:19387
              model: tts-1
              voice: local_voice
              language: zh
              promptLanguage: zh
              timeoutMs: 120000
              cacheEntries: 32
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # A conversation has no task list to keep, so `dsh-tool-todo` is
          # deliberately absent: every tool an agent does not need is a turn it
          # may waste. Compaction is the opposite case and is NOT optional —
          # coding tasks end, conversations do not, and without it a long
          # conversation overflows its context window.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
